name: Ferry Watch
version: "0.1.0"
slug: ferry_watch
description: Live map of the Porkkala inner-route ferries, with tracks since last port.
url: https://github.com/aronwarna/ha-ferry-watch
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:ferry
panel_title: Ferry Watch
homeassistant_api: true
options:
  retention_days: 60
  ha_entities: true
  log_level: info
schema:
  retention_days: int(7,365)
  ha_entities: bool
  log_level: list(debug|info|warning|error)
